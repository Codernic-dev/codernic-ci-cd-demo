name: Galileus Enterprise Security & Audit

on:
  pull_request:
    branches: [ "main" ]

jobs:
  galileus-audit:
    name: Code Review & Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Galileus Enterprise Pipeline
        env:
          GALILEUS_DEV_MODE: "1"
        run: |
          echo "Generating PR Git Diff..."
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          echo "Running Galileus Security Engine..."
          cargo run --manifest-path ../ai-agencee/crates/b2b/galileus-ci/Cargo.toml -- --diff pr.diff --sarif-output galileus-results.sarif || true
          if [ ! -f galileus-results.sarif ]; then
            echo '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Galileus Audit","rules":[]}},"results":[]}]}' > galileus-results.sarif
          fi

      - name: Upload SARIF Security Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: galileus-results.sarif
          category: galileus-ci
