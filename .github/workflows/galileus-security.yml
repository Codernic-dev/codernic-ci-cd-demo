name: Galileus Enterprise Security & Audit

on:
  pull_request:
    branches: [ "main" ]

jobs:
  galileus-audit:
    name: Code Review & Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Galileus Enterprise Pipeline
        uses: binaryjack/galileus-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          license_key: ${{ secrets.GALILEUS_ENTERPRISE_KEY }}
          strict_mode: true
          export_sarif: true

      - name: Upload SARIF Security Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: galileus-results.sarif
          category: galileus-ci
